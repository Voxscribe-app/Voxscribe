[package]
name = "duskr"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Native system-wide speech-to-text for Linux"
license = "MIT"
repository = "https://code.styna.net/projects/Duskr"

[workspace]
members = ["server"]
resolver = "2"

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
evdev = "0.13"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hound = "3.5"
lewton = "0.10"
libc = "0.2"
pipewire = "0.10"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "multipart", "query", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal", "process", "fs"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
whisper-rs = { version = "0.16", optional = true }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
