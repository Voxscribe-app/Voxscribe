name: Rebuild cargo cache

on:
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      # The cache action never overwrites an existing key, so the old entries
      # have to go before a build can repopulate them.
      - name: Delete existing caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete --all --repo "$GITHUB_REPOSITORY" || true

  build:
    needs: purge
    uses: ./.github/workflows/build.yml
