name: Build

on:
  push:
    branches: ["release"]
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, vulkan]
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libclang-dev pkg-config \
            libpipewire-0.3-dev libwayland-dev
          if [ "${{ matrix.backend }}" = "vulkan" ]; then
            sudo apt-get install -y --no-install-recommends libvulkan-dev glslc
          fi

      - name: Install CUDA toolkit
        if: matrix.backend == 'cuda'
        run: |
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-6 cuda-cudart-dev-12-6 cuda-cccl-12-6 libcublas-dev-12-6
          echo "CUDA_PATH=/usr/local/cuda-12.6" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"

      - name: Point bindgen at the clang builtin headers
        run: echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(cc -print-file-name=include)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.backend }}

      - name: Build
        run: cargo build --release -p duskr --features ${{ matrix.backend }}

      - uses: actions/upload-artifact@v5
        with:
          name: duskr-${{ matrix.backend }}
          path: target/release/duskr
